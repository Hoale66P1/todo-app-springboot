<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>To-Do List 1 Ngày</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h1 class="text-center mb-4">Danh Sách Công Việc</h1>

    <div class="card p-4 mb-4 shadow-sm">
        <form action="/add" method="post" class="d-flex gap-2">
            <input type="text" name="title" class="form-control" placeholder="Nhập việc cần làm..." required>
            <button type="submit" class="btn btn-primary">Thêm</button>
        </form>
    </div>

    <div class="card shadow-sm">
        <table class="table table-hover mb-0">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Tên công việc</th>
                <th>Trạng thái</th>
                <th>Hành động</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="todo : ${todos}">
                <td th:text="${todo.id}">1</td>
                <td th:text="${todo.title}">Học Java</td>
                <td>
                    <span th:if="${todo.completed}" class="badge bg-success">Đã xong</span>
                    <span th:unless="${todo.completed}" class="badge bg-warning text-dark">Chưa xong</span>
                </td>
                <td>
                    <a th:href="@{/delete/{id}(id=${todo.id})}" class="btn btn-danger btn-sm">Xóa</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
